<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя ✨</title>
    <style>
        body { font-family: sans-serif; background: #fff0f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 400px; width: 100%; text-align: center; }
        h1 { color: #ff6b8b; font-size: 22px; }
        .step { display: none; }
        .step.active { display: block; }
        .btn { background: #fff0f5; border: 1px solid #ffb6c1; padding: 12px; border-radius: 12px; cursor: pointer; margin: 5px 0; width: 100%; text-align: left; font-size: 16px; display: block; }
        .btn:hover { background: #ffb6c1; }
        .btn-next { background: #ff6b8b; color: white; border: none; padding: 12px 24px; border-radius: 12px; cursor: pointer; font-size: 16px; margin-top: 15px; }
        textarea { width: 100%; height: 80px; padding: 10px; box-sizing: border-box; border-radius: 12px; border: 1px solid #ffb6c1; }
    </style>
</head>
<body>

<form action="https://formspree.io" method="POST" class="card">
    
    <!-- Шаг 0 -->
    <div class="step active" id="s0">
        <h1>Привет, мой любимый! ✨</h1>
        <p>Я создал этот уголок специально для тебя. Пройди короткий опрос, пожалуйста!</p>
        <button type="button" class="btn-next" onclick="go(1)">Начать 💕</button>
    </div>

    <!-- Шаг 1 -->
    <div class="step" id="s1">
        <h1>Как ты себя чувствуешь?</h1>
        <input type="hidden" name="1. Настроение" id="q1">
        <button type="button" class="btn" onclick="save('q1','☀️ Всё супер, полон сил!')">☀️ Всё супер, полон сил!</button>
        <button type="button" class="btn" onclick="save('q1','☁️ Немного устал')">☁️ Немного устал</button>
        <button type="button" class="btn" onclick="save('q1','🌧️ Грустно или тревожно')">🌧️ Грустно или тревожно</button>
    </div>

    <!-- Шаг 2 -->
    <div class="step" id="s2">
        <h1>Ты сегодня кушал?</h1>
        <input type="hidden" name="2. Покушал" id="q2">
        <button type="button" class="btn" onclick="save('q2','🍔 Да, сытно и вкусно!')">🍔 Да, сытно и вкусно!</button>
        <button type="button" class="btn" onclick="save('q2','☕️ Только перекусил')">☕️ Только перекусил</button>
        <button type="button" class="btn" onclick="save('q2','🙅‍♂️ Нет, еще не успел')">🙅‍♂️ Нет, еще не успел</button>
    </div>

    <!-- Шаг 3 -->
    <div class="step" id="s3">
        <h1>Что тебе сейчас нужно?</h1>
        <input type="hidden" name="3. Что нужно" id="q3">
        <button type="button" class="btn" onclick="save('q3','🧸 Крепкие объятия')">🧸 Крепкие объятия</button>
        <button type="button" class="btn" onclick="save('q3','🍫 Игрульки')">🍫 Игрульки</button>
        <button type="button" class="btn" onclick="save('q3','🤫 Тишина и покой')">🤫 Тишина и покой</button>
    </div>

    <!-- Шаг 4 -->
    <div class="step" id="s4">
        <h1>О чем ты сейчас думаешь?</h1>
        <textarea name="4. Мысли" placeholder="Напиши тут все..."></textarea>
        

        <!-- Перенаправление после успешной отправки -->
        <input type="hidden" name="_next" value="https://github.io">
        <button type="submit" class="btn-next">Отправить ✨</button>
    </div>
</form>

<script>
    function go(num) {
        var steps = document.getElementsByClassName('step');
        for (var i = 0; i < steps.length; i++) {
            steps[i].classList.remove('active');
        }
        document.getElementById('s' + num).classList.add('active');
    }

    function save(id, val) {
        document.getElementById(id).value = val;
        if(id === 'q1') go(2);
        if(id === 'q2') go(3);
        if(id === 'q3') go(4);
    }
</script>

</body>
</html>
